<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revomaker System Share</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<video id="bg" src="bg.mp4" autoplay muted loop playsinline></video>
<div class="shade"></div>
<div class="wrap">
  <h1>Revomaker System Share</h1>
  <p class="sub" id="sub"></p>
  <div id="app"></div>
  <div class="foot" id="foot"><a href="dashboard.html">Owner login</a></div>
</div>
<script>
const app = document.getElementById('app');
function el(t, c, x) { const n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; }

async function show() {
  const t = location.hash.slice(1), sub = document.getElementById('sub'), foot = document.getElementById('foot');
  app.innerHTML = '';
  if (!/^[a-f0-9]{32}$/.test(t)) {           // no share link: show nothing
    sub.textContent = '';
    foot.hidden = false;
    app.appendChild(el('div', 'empty', 'Open the link that was shared with you.'));
    return;
  }
  foot.hidden = true;                          // someone with a link sees only the file
  sub.textContent = 'Shared with you.';
  const box = el('div', 'box'); app.appendChild(box);
  try {
    const r = await fetch('/api?do=get&t=' + t), f = await r.json();
    if (!r.ok) throw new Error(f.error || 'Error');
    const bar = el('div', 'bar'), left = el('div'), btns = el('div', 'btns'), ct = el('button', 'btn main', 'Copy text');
    left.append(el('h2', null, f.name), el('small', null, f.size.toLocaleString() + ' characters · updated ' + f.updated));
    ct.onclick = async () => { try { await navigator.clipboard.writeText(f.text); ct.textContent = 'Copied!'; } catch (e) { ct.textContent = 'Failed'; } setTimeout(() => { ct.textContent = 'Copy text'; }, 1500); };
    btns.append(ct); bar.append(left, btns);
    box.append(bar, el('pre', null, f.text));
  } catch (e) { box.appendChild(el('div', 'empty', e.message)); }
}
window.addEventListener('hashchange', show);
show();
</script>
</body>
</html>
